[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "simple-eda-swechchha"
version = "0.1.1"
description = "Tiny EDA helper"
license = { file = "LICENSE" }
dependencies = ["pandas>=1.5"]

[project.optional-dependencies]
# forest_viz (GFW tree-cover-loss visualizations) needs these:
viz = ["matplotlib>=3.7", "openpyxl>=3.1"]
test = ["pytest>=7"]

[tool.setuptools.package-data]
# Bundle the driver icons used by the pop-out map.
forest_viz = ["assets/icons/*.png"]
